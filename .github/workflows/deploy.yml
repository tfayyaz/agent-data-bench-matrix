name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate TOML
        run: uv run python scripts/validate.py

      - name: Generate JSON
        run: uv run python scripts/build.py

      - name: Check committed JSON is current
        run: git diff --exit-code -- data/generated/catalogue.json

      - name: Python tests
        run: uv run pytest -q

      - name: JavaScript tests
        run: node --test tests/*.test.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html css js vendor data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
